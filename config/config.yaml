# ═══════════════════════════════════════════════════════════════
#         TrendRadar 配置 —— Kozy 每日 AI/科技精选推送 定制版
#
#   基于上游 config.yaml v2.3.0 修改，改动处标注 [定制]
#   上游参考: https://github.com/sansan0/TrendRadar/blob/master/config/config.yaml
#   用法: 全文复制，粘贴覆盖 fork 仓库的 config/config.yaml
# ═══════════════════════════════════════════════════════════════


# ===============================================================
# 1. 基础设置
# ===============================================================
app:
  timezone: "Asia/Shanghai"
  show_version_update: true


# ===============================================================
# 1.5 调度系统
# [定制] 不启用。推送节奏由 GitHub Actions 的 cron 直接控制：
#        每天 UTC 0:03 / 12:03（北京时间 8:03 / 20:03）各跑一次，跑完即推
# ===============================================================
schedule:
  enabled: false
  preset: "morning_evening"


# ===============================================================
# 2. 数据源 - 热榜平台
# [定制] 只保留 4 个主流平台，配合 frequency_words.txt 过滤出 AI/科技内容
# ===============================================================
platforms:
  enabled: true
  api_url: ""
  sources:
    - id: "weibo"
      name: "微博"
      expected_domain: "weibo.com"
    - id: "zhihu"
      name: "知乎"
      expected_domain: "zhihu.com"
    - id: "toutiao"
      name: "今日头条"
      expected_domain: "toutiao.com"
    - id: "baidu"
      name: "百度热搜"
      expected_domain: "baidu.com"


# ===============================================================
# 3. 数据源 - RSS 订阅
# [定制] 三个精选源，内容在源头已做过质量筛选
# ===============================================================
rss:
  enabled: true

  freshness_filter:
    enabled: true
    max_age_days: 1                   # 只推 1 天内的文章

  # 顺序即推送展示顺序：BestBlogs 文章 → BestBlogs 早报 → AIHOT
  feeds:
    - id: "bestblogs-ai"
      name: "BestBlogs AI 高分文章"
      url: "https://www.bestblogs.dev/feeds/rss?category=ai&minScore=90"

    - id: "bestblogs-daily-brief"
      name: "BestBlogs 每日早报"
      url: "https://www.bestblogs.dev/feeds/rss/daily-brief"

    - id: "aihot"
      name: "AIHOT 每日精选"
      url: "https://aihot.virxact.com/feed.xml"

    # 可选：BestBlogs 产品类高分文章（PM 方向有价值）。
    # 想看就把 enabled 改为 true，并把 id 加进下方 display.standalone.rss_feeds
    - id: "bestblogs-product"
      name: "BestBlogs 产品高分文章"
      url: "https://www.bestblogs.dev/feeds/rss?category=product&minScore=85"
      enabled: false


# ===============================================================
# 4. 报告模式
# ===============================================================
report:
  mode: "current"                     # 每次运行推送当前在榜内容（Actions 每天只跑 2 次）
  display_mode: "keyword"
  sort_by_position_first: false
  rank_threshold: 5
  max_news_per_keyword: 2             # 晚报每个关键词组最多 2 条；早报由 workflow 自动降为 1


# ===============================================================
# 4.5 筛选策略
# ===============================================================
filter:
  method: "keyword"                   # 关键词匹配，不耗 token；以后想换 AI 筛选改成 "ai"
  priority_sort_enabled: true


# ===============================================================
# 4.6 AI 智能筛选配置（仅 filter.method=ai 时生效，当前未启用）
# ===============================================================
ai_filter:
  batch_size: 200
  batch_interval: 2
  min_score: 0.7
  reclassify_threshold: 0.6
  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"


# ===============================================================
# 5. 推送内容控制
# [定制] 精选 RSS 走「独立展示区」（不受关键词过滤）放最前，
#        热榜关键词匹配放后面；关闭普通 RSS 区避免内容重复
# ===============================================================
display:
  region_order:
    - standalone                      # 1️⃣ 精选 RSS（AIHOT + BestBlogs）
    - hotlist                         # 2️⃣ 热榜 AI/科技关键词匹配
    - rss
    - new_items
    - ai_analysis

  regions:
    hotlist: true
    new_items: false
    rss: false                        # [定制] 关闭：精选源已在独立展示区完整展示
    standalone: true                  # [定制] 开启
    ai_analysis: false                # [定制] 暂不启用（启用需配 AI_API_KEY）

  standalone:
    platforms: []
    rss_feeds: ["bestblogs-ai", "bestblogs-daily-brief", "aihot"]
    max_items: 6                      # 晚报每源 6 条；早报由 workflow 自动降为 3（见 crawler.yml）


# ===============================================================
# 6. 推送通知
# ⚠️ webhook 地址不要写在这里！填到 GitHub Secrets（名称 WEWORK_WEBHOOK_URL）
# ===============================================================
notification:
  enabled: true

  channels:
    feishu:
      webhook_url: ""
    dingtalk:
      webhook_url: ""
    wework:
      webhook_url: ""                 # 留空，由 GitHub Secrets 注入
      msg_type: "markdown"
    telegram:
      bot_token: ""
      chat_id: ""
    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""
    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""
    bark:
      url: ""
    slack:
      webhook_url: ""
    generic_webhook:
      webhook_url: ""
      payload_template: ""


# ===============================================================
# 7. 存储配置
# ===============================================================
storage:
  backend: "auto"
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: "output"
    retention_days: 0
  remote:
    retention_days: 0
    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""
  pull:
    enabled: false
    days: 7


# ===============================================================
# 8. AI 模型配置（当前未启用任何 AI 功能，配置保留备用）
# ===============================================================
ai:
  model: "deepseek/deepseek-v4-flash"
  api_key: ""                         # 启用 AI 功能时填到 GitHub Secrets 的 AI_API_KEY
  api_base: ""
  timeout: 120
  temperature: 1.0
  max_tokens: 5000
  num_retries: 1
  fallback_models: []


# ===============================================================
# 9. AI 分析功能（晚间日总结）
# [定制] 配好 AI_API_KEY Secret 后把下行改为 true。
#        行尾 AI_DAILY_SUMMARY 标记勿动：早间运行时 workflow 靠它自动关闭 AI
# ===============================================================
ai_analysis:
  enabled: false   # AI_DAILY_SUMMARY
  language: "Chinese"
  prompt_file: "ai_analysis_prompt.txt"
  mode: "follow_report"
  max_news_for_analysis: 150
  include_rss: false
  include_standalone: true
  include_rank_timeline: true


# ===============================================================
# 10. AI 翻译功能
# [定制] 不启用：三个精选源基本都是中文
# ===============================================================
ai_translation:
  enabled: false
  language: "中文"
  prompt_file: "ai_translation_prompt.txt"
  scope:
    hotlist: false
    rss: true
    standalone: true


# ===============================================================
# 11. 高级设置（保持上游默认）
# ===============================================================
advanced:
  debug: false

  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"
  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"

  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: "http://127.0.0.1:10801"

  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ""

  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1

  max_accounts_per_channel: 3

  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3
  feishu_message_separator: "━━━━━━━━━━━━━━━━"
