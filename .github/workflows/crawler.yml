TEMP_TEST_LINE# ═══════════════════════════════════════════════════════════════
#   Get Hot News —— Kozy 定制版（全自动，部署后零人工维护）
#
#   相对上游 crawler.yml 的改动：
#   1. 定时改为每天 2 次：UTC 0:23 / 12:23（北京时间 8:23 / 20:23）
#   2. 移除 7 天试用签到检查（上游以此控制公共资源占用；
#      作为补偿，运行频率已降到上游默认的 1/12，请给上游项目
#      sansan0/TrendRadar 和数据源 ourongxing/newsnow 点 star 支持）
#   3. 新增 Keepalive：仓库超 50 天无提交时自动创建空提交，
#      避免触发 GitHub「60 天不活跃自动停用定时任务」规则
#   4. 支持 Cloudflare Worker 通过 workflow_dispatch 传入 digest_mode，
#      从外部准点触发早报/晚报；GitHub schedule 暂时保留作兜底
#
#   用法: 全文复制，粘贴覆盖 fork 仓库的 .github/workflows/crawler.yml
# ═══════════════════════════════════════════════════════════════

name: Get Hot News

on:
  schedule:
    # UTC 0:23 / 12:23 = 北京时间 8:23 / 20:23（GitHub 免费版实际触发可能延迟几分钟到一小时）
    # ⚠️ 勿改回整点后 0–5 分：整点前后是 GitHub 全球定时任务最拥挤时段，
    #    负载过高时任务会被直接丢弃（2026-06-11 早报缺失即此原因）
    - cron: "23 0,12 * * *"

  workflow_dispatch:
    inputs:
      digest_mode:
        description: "Digest mode: auto infers from UTC hour; Cloudflare passes morning/evening"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - morning
          - evening

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Verify required files
        run: |
          if [ ! -f config/config.yaml ]; then
            echo "Error: Config missing"
            exit 1
          fi

      # 早间（UTC 0 点档 = 北京 8 点档）推送瘦身版：
      #   每个 RSS 源 6→3 条、每个关键词组 2→1 条、关闭 AI 日总结
      # 晚间（UTC 12 点档 = 北京 20 点档）用 config.yaml 完整配置
      # Cloudflare 触发时会显式传 digest_mode=morning/evening；
      # GitHub schedule 或手动不填时使用 auto，继续按当前 UTC 时间兜底判断。
      - name: Apply morning overrides (lighter digest)
        env:
          DIGEST_MODE: ${{ github.event.inputs.digest_mode || 'auto' }}
        run: |
          if [ "$DIGEST_MODE" = "auto" ]; then
            if [ "$(date -u +%H)" -lt 6 ]; then
              DIGEST_MODE="morning"
            else
              DIGEST_MODE="evening"
            fi
          fi

          echo "Digest mode: ${DIGEST_MODE}"

          if [ "$DIGEST_MODE" = "morning" ]; then
            sed -i "s/max_items: 6/max_items: 3/" config/config.yaml
            sed -i "s/max_news_per_keyword: 2/max_news_per_keyword: 1/" config/config.yaml
            sed -i "s/enabled: true   # AI_DAILY_SUMMARY/enabled: false  # AI_DAILY_SUMMARY/" config/config.yaml
            echo "Morning mode: lighter digest, AI summary off"
          elif [ "$DIGEST_MODE" = "evening" ]; then
            echo "Evening mode: full digest"
          else
            echo "Invalid digest_mode: ${DIGEST_MODE}"
            exit 1
          fi

      - name: Run crawler
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 通用Webhook配置
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
          GENERIC_WEBHOOK_TEMPLATE: ${{ secrets.GENERIC_WEBHOOK_TEMPLATE }}
          # AI 配置（ai_analysis 和 ai_translation 共享模型配置）
          AI_ANALYSIS_ENABLED: ${{ secrets.AI_ANALYSIS_ENABLED }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          # 远程存储配置
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          GITHUB_ACTIONS: true
        run: uv run python -m trendradar

      - name: Keepalive (prevent 60-day auto-disable)
        if: always()
        run: |
          LAST_COMMIT=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST_COMMIT) / 86400 ))
          echo "Days since last commit: ${DAYS}"
          if [ "$DAYS" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (auto)"
            git push
            echo "Created keepalive commit"
          fi
